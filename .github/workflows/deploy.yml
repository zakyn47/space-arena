name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zakyn47/space-arena

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm assets:check

  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build
        run: docker build -t "$IMAGE:${{ steps.meta.outputs.tag }}" .
      - name: Push
        run: docker push "$IMAGE:${{ steps.meta.outputs.tag }}"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: read
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
          HOST: ${{ secrets.HETZNER_HOST }}
          PORT: ${{ secrets.HETZNER_PORT }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CONFIG
          Host hetzner
            HostName $HOST
            Port $PORT
            User root
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            BatchMode yes
          CONFIG
          chmod 600 ~/.ssh/config
      # The key is restricted to /usr/local/sbin/space-arena-deploy on the host; the token lets it pull once.
      - name: Deploy and health check
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ssh hetzner "deploy $TAG"
      - name: Report
        if: always()
        run: echo "Deployed \`$TAG\` (${{ job.status }})" >> "$GITHUB_STEP_SUMMARY"
