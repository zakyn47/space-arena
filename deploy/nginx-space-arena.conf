# /etc/nginx/sites-available/space-arena (certbot adds the TLS lines)
limit_req_zone $binary_remote_addr zone=space_arena_auth:10m rate=20r/m;

map $http_upgrade $space_arena_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name spacearena.duckdns.org;

    server_tokens off;
    client_max_body_size 8k;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    location / {
        proxy_pass http://127.0.0.1:8100;
    }

    location /api/ {
        limit_req zone=space_arena_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8100;
    }

    location = /ws {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $space_arena_connection;
        proxy_read_timeout 1h;
        proxy_pass http://127.0.0.1:8100;
    }
}
