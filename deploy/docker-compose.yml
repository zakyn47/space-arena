services:
  space-arena:
    image: ${IMAGE:?IMAGE must be set in .env}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:8100:8080"
    volumes:
      - data:/data
    mem_limit: 512m
    pids_limit: 256
    cpus: 1.0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  data:
    name: space-arena_data
